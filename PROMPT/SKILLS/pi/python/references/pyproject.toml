# Template pyproject.toml — single source of config. Copy, rename, trim.

[project]
name = "my-project"
version = "0.1.0"
description = "One line."
requires-python = ">=3.11"
dependencies = [
    # "httpx>=0.27",
]

[dependency-groups]            # PEP 735; `uv add --dev pytest` writes here
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]              # `uv run my-cli` / installed console script
# my-cli = "my_project.cli:main"

[build-system]                 # only needed if the project is installable
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify,
# RUF ruff-specific, PTH prefer pathlib, C4 comprehensions, G logging format
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "C4", "G"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
