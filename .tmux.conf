# tmux new -s sessionname -d # detach
#
#  session tree: prefix w
#  session tree: prefix s
#
#  MOVE between SESSSIONS: prefix )
#  MOVE between SESSSIONS: prefix (
#  MOVE between WINDOWS: prefix n
#  MOVE between WINDOWS: prefix p
#
#  goto WINDOW: prefix 0-9
#
#  Kill window: prefix &
#
#  CREATE a WINDOW: prefix c
#  RENAME a WINDOW: prefix , # comma
#
#  Find a window that contains a string: prefix f
#
# tput colors
# 256
# set -g default-terminal "screen-256color"
#
# Get tpm
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# Protect these env vars: ADD to tmux's default list (-a), don't replace it.
# 3.8 default: DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID
# SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP
# XDG_SESSION_DESKTOP XDG_SESSION_TYPE
# -gu first resets to that default, so prefix r doesn't add duplicates.
set -gu update-environment
set -ag update-environment "HYPRLAND_INSTANCE_SIGNATURE XDG_DESKTOP_PORTAL XDG_RUNTIME_DIR"


set -g visual-activity on
###
set -g default-terminal "tmux-256color"
# foot is detected by tmux (RGB, clipboard, focus, sync, extkeys): no overrides needed
###
#
# via neovim checkhealth (10 is the default since tmux 3.5, kept for clarity)
set -sg escape-time 10
# vi (status-keys is set again after tpm below: tmux-sensible forces emacs)
setw -g mode-keys vi
set -g status-keys vi
# Set the base index for windows to 1 instead of 0
set -g base-index 1
# Set history limit 
set -g history-limit 100000 # default 2000
# Set the base index of panes to 1 instead of 0
set -g pane-base-index 1
# Close a gap in window numbers when a window is killed
set -g renumber-windows on
# base-index 1 makes prefix 0 dead; use it for window 10
bind 0 select-window -t :=10
# Setting the prefix from C-b to C-a
set -g prefix C-a
# Free the original Ctrl-b prefix keybinding
unbind C-b
set-option -g focus-events on
# bind the r to reload ~/.tmux.conf
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
# Split virt with vim of .tmux.conf
bind-key M split-window -h "nvim ~/.tmux.conf"
# Ensure that Ctrl-a get passed through to apps hit twice
# Makes ssh and starting a new tmux on top of hosts easier to navigate
bind C-a send-prefix
# splitting windows witn | and -
bind | split-window -h
bind - split-window -v
# Vi mode
# bind hjkl like vim to select panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Resize panes with HJKL - -r makes repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# More time for messages
set -g display-time 2500

set -g bell-action none
# Set bell action just in case

# Toggle sync for THIS window only (no -g), and say which way it went
bind = setw synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,on,off}"


set -g status-style "bg=colour0,fg=colour7"

#########################
# Turn on mouse mode
#
# Make mouse useful in copy mode
set -g mouse on

# Highlights the window "tab" when write activity
setw -g monitor-activity on

